# Job Radar workflow, versjon 3.
# This file must live at: .github/workflows/radar_check.yml in your repo.
# job_radar.py and config.json go in the repo root. docs/index.html is the dashboard.
#
# One time setup in the repo:
#   Settings -> Actions -> General -> Workflow permissions -> "Read and write permissions"
#   Settings -> Pages -> Deploy from a branch -> main -> /docs
# Optional secrets (Settings -> Secrets and variables -> Actions):
#   NTFY_TOPIC                       push to your phone via ntfy
#   SMTP_USER, SMTP_PASS             mail from your own Gmail instead of GitHub issues
#   ALERT_EMAIL                      recipient for the SMTP mail
#   (kept as secrets so the repo can be PUBLIC, which free GitHub Pages requires)
#
# Email needs no secrets: the script opens a GitHub issue per run with new
# hits, and GitHub emails the repo owner about new issues.

name: job radar

on:
  schedule:
    # GitHub's free scheduler is best effort and silently skips most slots
    # (in practice hours can pass between runs). So ask often, and let the
    # "checked recently" gate below hold the real pace at one check per
    # ~30 minutes at most, which keeps us polite to the career sites.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test alert through the real email path (no scraping)"
        type: boolean
        default: false
      heartbeat:
        description: "Run normally and also send the weekly 'radar alive' mail now"
        type: boolean
        default: false
      dry_run:
        description: "Read every source and print what would alert, send nothing, save nothing"
        type: boolean
        default: false
      dry_run_target:
        description: "Dry run only targets whose name contains this (blank = all)"
        type: string
        default: ""

permissions:
  contents: write
  issues: write

# never let a cron run and a manual run push at the same time
concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Scheduled runs only: stop here if the last check is under 25 minutes old.
      # Manual runs ("Kjør sjekk nå") always go through.
      - name: Checked recently?
        id: gate
        if: github.event_name == 'schedule'
        run: |
          last=$(jq -r '.generated // empty' docs/status.json 2>/dev/null || true)
          if [ -n "$last" ] && last_s=$(date -u -d "$last" +%s 2>/dev/null); then
            age=$(( $(date -u +%s) - last_s ))
            if [ "$age" -ge 0 ] && [ "$age" -lt 1500 ]; then
              echo "Siste sjekk var for $((age / 60)) min siden, hopper over denne."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/setup-python@v7
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run radar
        if: steps.gate.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DRY_RUN_TARGET: ${{ inputs.dry_run_target }}
        run: python job_radar.py ${{ inputs.test_alert && '--test' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.heartbeat && '--heartbeat' || '' }}

      - name: Persist state and status
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add seen.json docs/status.json
          git diff --cached --quiet || (git commit -m "radar update" && git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME")
