# Runs the test suite whenever the radar's code or config changes.
# (The radar's own "radar update" commits never trigger this.)
name: tests

on:
  push:
    branches: [main]
    paths:
      - "job_radar.py"
      - "config.json"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/tests.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
